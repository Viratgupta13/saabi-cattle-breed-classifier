name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t saabi .
      - name: Smoke-test the container
        run: |
          docker run -d --name saabi -p 7860:7860 saabi
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7860/api/health && exit 0
            sleep 3
          done
          docker logs saabi
          exit 1
